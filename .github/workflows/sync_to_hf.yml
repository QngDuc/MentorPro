name: Sync to Hugging Face Space

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Lấy toàn bộ history

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add huggingface https://QngDuc:$HF_TOKEN@huggingface.co/spaces/QngDuc/MentorPro
          git push huggingface master --force